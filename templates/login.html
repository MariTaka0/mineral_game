<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Угадай минерал</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-logo">💎</div>
        <h1>Угадай минерал</h1>
        <p class="login-subtitle">Войдите, чтобы начать игру</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Логин</label>
                <input type="text" id="username" name="username" required
                       autocomplete="username" placeholder="фамилия_имя">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       autocomplete="current-password" placeholder="••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Войти</button>
        </form>

        <p class="login-hint">Логин и пароль выдаёт учитель географии</p>
    </div>
</body>
</html>
